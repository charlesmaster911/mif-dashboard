      text { font-family: 'Noto Sans KR', Arial, sans-serif; }
      .title { font-size: 16px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 11px; fill: #444; }
      .dim { font-size: 9px; fill: #d32f2f; }
      .label-sm { font-size: 9px; fill: #555; }
      .label { font-size: 11px; fill: #1a1a1a; font-weight: bold; }
      .wall-thick { fill: #bdbdbd; stroke: #666; stroke-width: 1; }

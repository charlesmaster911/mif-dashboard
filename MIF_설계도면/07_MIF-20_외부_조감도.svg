<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      text { font-family: 'Malgun Gothic', Arial, sans-serif; }
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
    <linearGradient id="containerBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="40%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <linearGradient id="containerSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a252f"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <linearGradient id="containerTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d566e"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(200,230,255,0.8)"/>
      <stop offset="50%" stop-color="rgba(180,220,250,0.5)"/>
      <stop offset="100%" stop-color="rgba(200,230,255,0.7)"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#95a5a6"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
    <linearGradient id="led-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- Ground -->
  <rect x="0" y="520" width="1200" height="280" fill="url(#ground)"/>
  <rect x="0" y="520" width="1200" height="5" fill="#bdc3c7"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">MIF-20 마이크로 아이스팩토리 — 외부 조감도</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#555">20ft Standard Container | Eco-Futurism Design | ㈜마스터마인딩그룹</text>

  <!-- ===== CONTAINER BODY (3/4 view) ===== -->
  <!-- Main front face -->
  <polygon points="150,200 850,200 850,510 150,510" fill="url(#containerBody)" stroke="#1a252f" stroke-width="2"/>

  <!-- Top face (perspective) -->
  <polygon points="150,200 850,200 950,150 250,150" fill="url(#containerTop)" stroke="#1a252f" stroke-width="2"/>

  <!-- Right side face (perspective) -->
  <polygon points="850,200 950,150 950,460 850,510" fill="url(#containerSide)" stroke="#1a252f" stroke-width="2"/>

  <!-- Container corrugation lines (front) -->
  <g stroke="#3d566e" stroke-width="1" opacity="0.5">
    <line x1="150" y1="230" x2="850" y2="230"/>
    <line x1="150" y1="260" x2="850" y2="260"/>
    <line x1="150" y1="290" x2="850" y2="290"/>
    <line x1="150" y1="320" x2="850" y2="320"/>
    <line x1="150" y1="350" x2="850" y2="350"/>
    <line x1="150" y1="380" x2="850" y2="380"/>
    <line x1="150" y1="410" x2="850" y2="410"/>
    <line x1="150" y1="440" x2="850" y2="440"/>
    <line x1="150" y1="470" x2="850" y2="470"/>
  </g>

  <!-- Container corrugation (side) -->
  <g stroke="#1a252f" stroke-width="0.8" opacity="0.4">
    <line x1="860" y1="206" x2="955" y2="157"/>
    <line x1="870" y1="236" x2="955" y2="190"/>
    <line x1="870" y1="266" x2="955" y2="220"/>
    <line x1="870" y1="296" x2="955" y2="250"/>
    <line x1="870" y1="326" x2="955" y2="280"/>
    <line x1="870" y1="356" x2="955" y2="310"/>
    <line x1="870" y1="386" x2="955" y2="340"/>
    <line x1="870" y1="416" x2="955" y2="370"/>
    <line x1="870" y1="446" x2="955" y2="400"/>
    <line x1="870" y1="476" x2="955" y2="430"/>
  </g>

  <!-- ===== ZONE LABELS ON CONTAINER ===== -->
  <!-- Zone A: 냉동기실 (left end) -->
  <rect x="155" y="205" width="100" height="300" fill="#1a252f" opacity="0.3"/>
  <text x="205" y="360" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">A</text>
  <text x="205" y="375" text-anchor="middle" font-size="9" fill="#e74c3c">냉동기실</text>
  <!-- Vent grille -->
  <rect x="170" y="220" width="70" height="50" fill="#1a252f" stroke="#555" rx="3"/>
  <g stroke="#3d566e" stroke-width="2">
    <line x1="175" y1="230" x2="235" y2="230"/>
    <line x1="175" y1="240" x2="235" y2="240"/>
    <line x1="175" y1="250" x2="235" y2="250"/>
    <line x1="175" y1="260" x2="235" y2="260"/>
  </g>

  <!-- Zone B: 냉동고 (no windows, solid) -->
  <rect x="260" y="205" width="250" height="300" fill="rgba(26,37,47,0.2)"/>
  <text x="385" y="360" text-anchor="middle" font-size="13" fill="#3498db" font-weight="bold">B</text>
  <text x="385" y="378" text-anchor="middle" font-size="10" fill="#3498db">워크인 냉동고</text>
  <text x="385" y="393" text-anchor="middle" font-size="9" fill="#3498db">-18℃ | 듀오메이커 462개</text>
  <!-- Insulation indicator stripe -->
  <rect x="260" y="490" width="250" height="15" fill="#2980b9" opacity="0.6" rx="2"/>
  <text x="385" y="501" text-anchor="middle" font-size="8" fill="white">PUR 단열 100mm</text>

  <!-- Zone C: 가공포장실 (small window) -->
  <rect x="515" y="250" width="120" height="100" fill="url(#glass)" stroke="#bdc3c7" stroke-width="2" rx="3"/>
  <line x1="575" y1="250" x2="575" y2="350" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="515" y1="300" x2="635" y2="300" stroke="#bdc3c7" stroke-width="1"/>
  <text x="575" y="390" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">C</text>
  <text x="575" y="405" text-anchor="middle" font-size="9" fill="#e67e22">가공·포장실</text>

  <!-- Zone D: 서비스 (large glass folding door) -->
  <!-- Transparent folding door -->
  <rect x="650" y="230" width="195" height="230" fill="url(#glass)" stroke="#bdc3c7" stroke-width="2" rx="3"/>
  <!-- Folding door divisions -->
  <line x1="715" y1="230" x2="715" y2="460" stroke="#bdc3c7" stroke-width="1.5"/>
  <line x1="780" y1="230" x2="780" y2="460" stroke="#bdc3c7" stroke-width="1.5"/>
  <!-- Interior visible through glass -->
  <rect x="660" y="390" width="60" height="60" fill="rgba(46,204,113,0.3)" rx="30"/>
  <text x="690" y="425" text-anchor="middle" font-size="8" fill="#27ae60">로봇</text>
  <rect x="730" y="400" width="50" height="50" fill="rgba(46,204,113,0.2)" rx="3"/>
  <text x="755" y="430" text-anchor="middle" font-size="7" fill="#27ae60">키오스크</text>
  <!-- Ice display visible -->
  <rect x="660" y="300" width="170" height="30" fill="rgba(52,152,219,0.2)" rx="3"/>
  <text x="745" y="320" text-anchor="middle" font-size="8" fill="#2980b9">얼음 디스플레이</text>

  <text x="745" y="480" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="bold">D — 서비스·판매</text>
  <text x="745" y="495" text-anchor="middle" font-size="9" fill="#27ae60">투명 폴딩도어</text>

  <!-- ===== LED STRIP ===== -->
  <rect x="150" y="495" width="700" height="8" fill="url(#led-glow)" opacity="0.8" rx="2"/>
  <rect x="150" y="200" width="700" height="4" fill="url(#led-glow)" opacity="0.6" rx="1"/>

  <!-- ===== BRANDING ===== -->
  <!-- Logo area -->
  <rect x="280" y="420" width="200" height="60" fill="rgba(0,0,0,0.3)" rx="5"/>
  <text x="380" y="448" text-anchor="middle" font-size="18" font-weight="bold" fill="white" letter-spacing="3">JEWEL ICE</text>
  <text x="380" y="468" text-anchor="middle" font-size="10" fill="#00e5ff">MICRO ICE FACTORY</text>

  <!-- ===== SERVICE WINDOW (side) ===== -->
  <rect x="920" y="300" width="25" height="100" fill="url(#glass)" stroke="#bdc3c7" stroke-width="1.5" rx="2"/>
  <text x="970" y="355" font-size="9" fill="#27ae60" font-weight="bold">서비스창</text>

  <!-- ===== ROOF DETAILS ===== -->
  <!-- Condenser unit on top -->
  <rect x="200" y="145" width="80" height="30" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="1.5" rx="3"/>
  <text x="240" y="164" text-anchor="middle" font-size="8" fill="white">콘덴서</text>
  <!-- Solar panel (add-on) -->
  <rect x="400" y="130" width="200" height="35" fill="#2c3e50" stroke="#1a252f" stroke-width="1" rx="2"/>
  <g stroke="#3498db" stroke-width="0.5" opacity="0.6">
    <line x1="420" y1="135" x2="420" y2="160"/><line x1="440" y1="135" x2="440" y2="160"/>
    <line x1="460" y1="135" x2="460" y2="160"/><line x1="480" y1="135" x2="480" y2="160"/>
    <line x1="500" y1="135" x2="500" y2="160"/><line x1="520" y1="135" x2="520" y2="160"/>
    <line x1="540" y1="135" x2="540" y2="160"/><line x1="560" y1="135" x2="560" y2="160"/>
    <line x1="580" y1="135" x2="580" y2="160"/>
    <line x1="405" y1="145" x2="595" y2="145"/>
    <line x1="405" y1="155" x2="595" y2="155"/>
  </g>
  <text x="500" y="126" text-anchor="middle" font-size="8" fill="#3498db">태양광 패널 (Add-on)</text>

  <!-- ===== GROUND DETAILS ===== -->
  <!-- Shadow -->
  <ellipse cx="550" cy="530" rx="450" ry="20" fill="rgba(0,0,0,0.15)"/>

  <!-- Foundation blocks -->
  <rect x="170" y="510" width="80" height="25" fill="#7f8c8d" stroke="#5d6d7e" rx="2"/>
  <rect x="400" y="510" width="80" height="25" fill="#7f8c8d" stroke="#5d6d7e" rx="2"/>
  <rect x="630" y="510" width="80" height="25" fill="#7f8c8d" stroke="#5d6d7e" rx="2"/>
  <rect x="830" y="508" width="60" height="20" fill="#7f8c8d" stroke="#5d6d7e" rx="2"/>

  <!-- ===== PEOPLE FOR SCALE ===== -->
  <!-- Person 1 near service window -->
  <g transform="translate(1000,340)">
    <circle cx="0" cy="0" r="12" fill="#ecf0f1" stroke="#bdc3c7"/>
    <rect x="-8" y="14" width="16" height="35" fill="#3498db" rx="3"/>
    <line x1="-3" y1="50" x2="-8" y2="85" stroke="#2c3e50" stroke-width="3"/>
    <line x1="3" y1="50" x2="8" y2="85" stroke="#2c3e50" stroke-width="3"/>
    <!-- Tumbler in hand -->
    <rect x="10" y="25" width="8" height="14" fill="#ecf0f1" stroke="#bdc3c7" rx="2"/>
  </g>
  <text x="1000" y="440" text-anchor="middle" font-size="8" fill="#555">아블러 텀블러</text>

  <!-- Person 2 walking -->
  <g transform="translate(1080,350)">
    <circle cx="0" cy="0" r="10" fill="#ecf0f1" stroke="#bdc3c7"/>
    <rect x="-7" y="12" width="14" height="30" fill="#e74c3c" rx="3"/>
    <line x1="-2" y1="43" x2="-10" y2="73" stroke="#2c3e50" stroke-width="2.5"/>
    <line x1="2" y1="43" x2="10" y2="73" stroke="#2c3e50" stroke-width="2.5"/>
  </g>

  <!-- ===== INFO LABELS ===== -->
  <!-- Dimension lines -->
  <line x1="150" y1="560" x2="850" y2="560" stroke="#e74c3c" stroke-width="1.5" marker-start="url(#arrowL)" marker-end="url(#arrowR)"/>
  <text x="500" y="578" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">6,058 mm (20ft)</text>

  <line x1="850" y1="560" x2="950" y2="510" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="920" y="545" font-size="9" fill="#e74c3c">2,438mm (폭)</text>

  <line x1="100" y1="200" x2="100" y2="510" stroke="#e74c3c" stroke-width="1"/>
  <text x="85" y="360" text-anchor="middle" font-size="9" fill="#e74c3c" transform="rotate(-90,85,360)">2,591mm (높이)</text>

  <!-- Feature callouts -->
  <g font-size="9" fill="#2c3e50">
    <!-- Callout 1 -->
    <line x1="205" y1="245" x2="80" y2="120" stroke="#e74c3c" stroke-width="0.8"/>
    <rect x="10" y="105" width="130" height="22" fill="white" stroke="#e74c3c" rx="3"/>
    <text x="75" y="120" text-anchor="middle" fill="#e74c3c" font-weight="bold">환기구 (콘덴서 배열)</text>

    <!-- Callout 2 -->
    <line x1="385" y1="500" x2="385" y2="620" stroke="#2980b9" stroke-width="0.8"/>
    <rect x="310" y="622" width="150" height="22" fill="white" stroke="#2980b9" rx="3"/>
    <text x="385" y="637" text-anchor="middle" fill="#2980b9" font-weight="bold">PUR 100mm 단열 (전면)</text>

    <!-- Callout 3 -->
    <line x1="745" y1="230" x2="745" y2="100" stroke="#27ae60" stroke-width="0.8"/>
    <rect x="670" y="85" width="150" height="22" fill="white" stroke="#27ae60" rx="3"/>
    <text x="745" y="100" text-anchor="middle" fill="#27ae60" font-weight="bold">투명 폴딩도어 (에코 디자인)</text>

    <!-- Callout 4 -->
    <line x1="500" y1="145" x2="500" y2="90" stroke="#3498db" stroke-width="0.8"/>
    <rect x="650" y="75" width="10" height="1" fill="none"/>
  </g>

  <!-- LED accent label -->
  <line x1="150" y1="498" x2="100" y2="620" stroke="#00e5ff" stroke-width="0.8"/>
  <rect x="30" y="615" width="140" height="22" fill="white" stroke="#00e5ff" rx="3"/>
  <text x="100" y="630" text-anchor="middle" font-size="9" fill="#0097a7" font-weight="bold">LED 상태표시 (ESG 지표)</text>

  <!-- Copyright -->
  <text x="1150" y="785" text-anchor="end" font-size="9" fill="#999">© 2026 MasterMinding Group — MIF-20 Exterior v1.0</text>
</svg>

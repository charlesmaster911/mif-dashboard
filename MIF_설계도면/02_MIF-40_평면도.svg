    <rect x="28" y="0" width="12" height="7" class="duo"/><rect x="42" y="0" width="12" height="7" class="duo"/>
    <rect x="56" y="0" width="12" height="7" class="duo"/><rect x="70" y="0" width="12" height="7" class="duo"/>
    <rect x="84" y="0" width="12" height="7" class="duo"/><rect x="98" y="0" width="12" height="7" class="duo"/>
    <rect x="112" y="0" width="12" height="7" class="duo"/><rect x="126" y="0" width="12" height="7" class="duo"/>
    <rect x="140" y="0" width="12" height="7" class="duo"/><rect x="154" y="0" width="12" height="7" class="duo"/>
    <rect x="168" y="0" width="12" height="7" class="duo"/><rect x="182" y="0" width="12" height="7" class="duo"/>
    <rect x="196" y="0" width="12" height="7" class="duo"/><rect x="210" y="0" width="12" height="7" class="duo"/>
    <rect x="224" y="0" width="12" height="7" class="duo"/><rect x="238" y="0" width="12" height="7" class="duo"/>
    <rect x="252" y="0" width="12" height="7" class="duo"/><rect x="266" y="0" width="12" height="7" class="duo"/>
    <rect x="280" y="0" width="12" height="7" class="duo"/><rect x="294" y="0" width="12" height="7" class="duo"/>
    <rect x="308" y="0" width="12" height="7" class="duo"/><rect x="322" y="0" width="12" height="7" class="duo"/>
    <rect x="336" y="0" width="12" height="7" class="duo"/><rect x="350" y="0" width="12" height="7" class="duo"/>

  <!-- ===== ZONE D: 서비스 바 (2,400mm → 332px) ===== -->
  <rect x="1174" y="88" width="332" height="354" fill="#e8f5e9" stroke="#999" stroke-width="1"/>
  <line x1="1506" y1="88" x2="1506" y2="442" class="partition"/>

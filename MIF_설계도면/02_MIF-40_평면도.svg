    <rect x="224" y="0" width="12" height="7" class="duo"/><rect x="238" y="0" width="12" height="7" class="duo"/>
    <rect x="252" y="0" width="12" height="7" class="duo"/><rect x="266" y="0" width="12" height="7" class="duo"/>
    <rect x="280" y="0" width="12" height="7" class="duo"/><rect x="294" y="0" width="12" height="7" class="duo"/>
    <rect x="308" y="0" width="12" height="7" class="duo"/><rect x="322" y="0" width="12" height="7" class="duo"/>
    <rect x="336" y="0" width="12" height="7" class="duo"/><rect x="350" y="0" width="12" height="7" class="duo"/>

  <text x="1619" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a1b9a">E — 창고·유틸리티</text>
  <text x="1619" y="127" text-anchor="middle" class="label-sm" fill="#6a1b9a">1,632mm</text>

  <!-- Tumbler storage -->
  <rect x="1518" y="145" width="200" height="60" class="equipment" fill="#e8eaf6"/>
  <text x="1618" y="172" text-anchor="middle" class="label-sm">아블러 텀블러 보관대 (500개)</text>
  <text x="1618" y="185" text-anchor="middle" class="label-sm">Ø87mm × H150mm × 500 = 선반 5단</text>


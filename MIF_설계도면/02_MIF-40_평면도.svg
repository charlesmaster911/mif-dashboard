<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap");
      text { font-family: 'Noto Sans KR', Arial, sans-serif; }
      .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 12px; fill: #444; }
      .dim { font-size: 10px; fill: #d32f2f; }
      .label { font-size: 11px; fill: #1a1a1a; font-weight: bold; }
      .label-sm { font-size: 9px; fill: #555; }
      .zone-label { font-size: 13px; fill: white; font-weight: bold; }
      .wall { fill: none; stroke: #333; stroke-width: 3; }
      .partition { stroke: #444; stroke-width: 2; }
      .shelf { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .duo { fill: #fff; stroke: #2196F3; stroke-width: 1; rx: 1; }
      .equipment { fill: #f5f5f5; stroke: #777; stroke-width: 1.5; rx: 3; }
    </style>
    <marker id="arR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#d32f2f"/>
    </marker>
    <marker id="arL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#d32f2f"/>
    </marker>
    <pattern id="cold" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e3f2fd"/>
      <circle cx="4" cy="4" r="1" fill="#90caf9" opacity="0.5"/>
    </pattern>
    <pattern id="hatch40" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ccc" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Title -->

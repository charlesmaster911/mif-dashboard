  <text x="900" y="48" text-anchor="middle" class="subtitle">40ft High-Cube Container | 내부: 12,032 × 2,352 × 2,698 mm | Scale ≈ 1:80</text>

  <!-- Container outer wall -->
  <rect x="60" y="80" width="1680" height="370" class="wall" fill="url(#hatch40)" rx="2"/>
  <!-- Inner wall -->
  <rect x="68" y="88" width="1664" height="354" fill="white" stroke="#999" stroke-width="1"/>

  <!-- ===== ZONE A: 냉동기실 (800mm → 110px) ===== -->
  <rect x="68" y="88" width="110" height="354" fill="#fce4ec" stroke="#999" stroke-width="1"/>
  <line x1="178" y1="88" x2="178" y2="442" class="partition"/>
  <text x="123" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">A</text>
  <text x="123" y="268" text-anchor="middle" class="label-sm" fill="#c62828">냉동기실</text>
  <text x="123" y="280" text-anchor="middle" class="label-sm" fill="#c62828">800mm</text>
  <!-- Equipment -->
  <rect x="78" y="105" width="90" height="45" class="equipment" fill="#ffcdd2"/>
  <text x="123" y="130" text-anchor="middle" class="label-sm">컴프레서①</text>
  <rect x="78" y="160" width="90" height="45" class="equipment" fill="#ffcdd2"/>

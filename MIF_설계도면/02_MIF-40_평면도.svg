  <g transform="translate(190,290)">
    <rect x="0" y="0" width="12" height="7" class="duo"/><rect x="14" y="0" width="12" height="7" class="duo"/>
    <rect x="28" y="0" width="12" height="7" class="duo"/><rect x="42" y="0" width="12" height="7" class="duo"/>

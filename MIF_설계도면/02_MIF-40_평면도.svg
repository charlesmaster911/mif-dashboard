  <rect x="78" y="350" width="90" height="45" class="equipment" fill="#fff9c4"/>
  <text x="123" y="376" text-anchor="middle" class="label-sm">전기패널</text>

  <!-- ===== ZONE B: 워크인 냉동고 (4,800mm → 664px) ===== -->
  <rect x="178" y="88" width="664" height="354" fill="url(#cold)" stroke="#1565c0" stroke-width="2"/>
  <line x1="842" y1="88" x2="842" y2="442" class="partition" stroke="#1565c0" stroke-width="2"/>
  <text x="510" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">B — 워크인 냉동고 (-18℃)</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#bbb"/>
    </linearGradient>
    <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#ddd"/>
    </linearGradient>
    <linearGradient id="freezerWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4e6f9"/>
      <stop offset="100%" stop-color="#a8cce8"/>
    </linearGradient>
    <linearGradient id="stainless" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="30%" stop-color="#ccc"/>
      <stop offset="60%" stop-color="#ddd"/>
      <stop offset="100%" stop-color="#bbb"/>
    </linearGradient>
    <linearGradient id="iceGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(200,230,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(150,210,250,0.6)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#e94560" font-family="Malgun Gothic, Arial">MIF-20 마이크로 아이스팩토리 — 내부 투시도</text>
  <text x="600" y="55" text-anchor="middle" font-size="12" fill="#888" font-family="Malgun Gothic, Arial">20ft Container Interior View | Zone A~D 전체 구조</text>

  <!-- ===== PERSPECTIVE ROOM (1-point perspective) ===== -->
  <!-- Floor -->
  <polygon points="50,700 1150,700 950,400 250,400" fill="url(#floorG)" stroke="#999" stroke-width="1"/>
  <!-- Floor grid -->
  <g stroke="#ccc" stroke-width="0.5" opacity="0.5">
    <line x1="150" y1="650" x2="350" y2="400"/><line x1="250" y1="700" x2="400" y2="400"/>
    <line x1="450" y1="700" x2="500" y2="400"/><line x1="650" y1="700" x2="600" y2="400"/>
    <line x1="850" y1="700" x2="700" y2="400"/><line x1="1050" y1="700" x2="800" y2="400"/>
    <line x1="50" y1="600" x2="1150" y2="600"/>
    <line x1="100" y1="500" x2="1100" y2="500"/>
  </g>

  <!-- Back wall -->
  <rect x="250" y="100" width="700" height="300" fill="url(#wallG)" stroke="#aaa" stroke-width="1"/>

  <!-- Left wall -->
  <polygon points="50,80 250,100 250,400 50,700" fill="#e8e8e8" stroke="#aaa" stroke-width="1"/>

  <!-- Right wall -->
  <polygon points="1150,80 950,100 950,400 1150,700" fill="#e0e0e0" stroke="#aaa" stroke-width="1"/>

  <!-- Ceiling -->
  <polygon points="50,80 1150,80 950,100 250,100" fill="#f5f5f5" stroke="#aaa" stroke-width="1"/>

  <!-- ===== ZONE A: 냉동기실 (far left) ===== -->
  <!-- Partition wall -->
  <polygon points="250,100 350,100 200,700 50,700" fill="rgba(200,200,200,0.5)" stroke="#999"/>

  <!-- Compressor (visible through cutaway) -->
  <rect x="80" y="400" width="100" height="120" fill="#e74c3c" opacity="0.7" rx="5"/>
  <text x="130" y="455" text-anchor="middle" font-size="11" fill="white" font-weight="bold" font-family="Malgun Gothic">컴프레서</text>
  <text x="130" y="472" text-anchor="middle" font-size="9" fill="white" font-family="Malgun Gothic">1HP</text>

  <!-- Electric panel -->
  <rect x="80" y="540" width="100" height="80" fill="#f39c12" opacity="0.7" rx="5"/>
  <text x="130" y="583" text-anchor="middle" font-size="10" fill="white" font-weight="bold" font-family="Malgun Gothic">전기패널</text>

  <text x="130" y="370" text-anchor="middle" font-size="13" fill="#e74c3c" font-weight="bold" font-family="Malgun Gothic">Zone A</text>

  <!-- ===== ZONE B: 워크인 냉동고 ===== -->
  <!-- Freezer walls (blue tint) -->
  <polygon points="200,100 500,100 420,680 120,680" fill="url(#freezerWall)" opacity="0.4" stroke="#2980b9" stroke-width="1"/>

  <!-- Freezer back wall -->
  <rect x="280" y="105" width="200" height="290" fill="url(#freezerWall)" opacity="0.5"/>

  <!-- Shelves (left side - perspective) -->
  <g opacity="0.9">
    <!-- 7 shelf tiers on left wall -->
    <polygon points="210,380 440,320 440,330 210,395" fill="url(#stainless)" stroke="#999"/>
    <polygon points="210,340 440,285 440,295 210,355" fill="url(#stainless)" stroke="#999"/>
    <polygon points="210,300 440,250 440,260 210,315" fill="url(#stainless)" stroke="#999"/>
    <polygon points="210,260 440,215 440,225 210,275" fill="url(#stainless)" stroke="#999"/>
    <polygon points="210,220 440,180 440,190 210,235" fill="url(#stainless)" stroke="#999"/>
    <polygon points="210,185 440,150 440,158 210,198" fill="url(#stainless)" stroke="#999"/>
    <polygon points="210,155" fill="none"/>
  </g>

  <!-- Duo Makers on shelves (blue rectangles) -->
  <g fill="#bbdefb" stroke="#1565c0" stroke-width="0.8" opacity="0.8">
    <!-- Row of duo makers on shelf -->
    <rect x="230" y="345" width="12" height="18" rx="1"/><rect x="245" y="343" width="12" height="18" rx="1"/>
    <rect x="260" y="341" width="12" height="18" rx="1"/><rect x="275" y="339" width="12" height="18" rx="1"/>
    <rect x="290" y="337" width="12" height="18" rx="1"/><rect x="305" y="335" width="12" height="18" rx="1"/>
    <rect x="320" y="333" width="12" height="18" rx="1"/><rect x="335" y="331" width="12" height="18" rx="1"/>
    <rect x="350" y="329" width="12" height="18" rx="1"/><rect x="365" y="327" width="12" height="18" rx="1"/>
    <rect x="380" y="325" width="12" height="18" rx="1"/>
    <!-- Second tier -->
    <rect x="230" y="305" width="12" height="18" rx="1"/><rect x="245" y="303" width="12" height="18" rx="1"/>
    <rect x="260" y="301" width="12" height="18" rx="1"/><rect x="275" y="299" width="12" height="18" rx="1"/>
    <rect x="290" y="297" width="12" height="18" rx="1"/><rect x="305" y="295" width="12" height="18" rx="1"/>
    <rect x="320" y="293" width="12" height="18" rx="1"/><rect x="335" y="291" width="12" height="18" rx="1"/>
    <rect x="350" y="289" width="12" height="18" rx="1"/><rect x="365" y="287" width="12" height="18" rx="1"/>
    <rect x="380" y="285" width="12" height="18" rx="1"/>
    <!-- Third tier -->
    <rect x="230" y="265" width="12" height="18" rx="1"/><rect x="245" y="263" width="12" height="18" rx="1"/>
    <rect x="260" y="261" width="12" height="18" rx="1"/><rect x="275" y="259" width="12" height="18" rx="1"/>
    <rect x="290" y="257" width="12" height="18" rx="1"/><rect x="305" y="255" width="12" height="18" rx="1"/>
    <rect x="320" y="253" width="12" height="18" rx="1"/>
  </g>

  <!-- Freezer cold air effect -->
  <g opacity="0.3" fill="none" stroke="#64b5f6" stroke-width="1">
    <path d="M320,130 Q330,200 310,280" stroke-dasharray="3,3"/>
    <path d="M380,130 Q370,200 390,280" stroke-dasharray="3,3"/>
    <path d="M340,130 Q350,180 340,250" stroke-dasharray="3,3"/>
  </g>

  <!-- Unit cooler (ceiling) -->
  <rect x="290" y="108" width="130" height="20" fill="#64b5f6" stroke="#1565c0" rx="5" opacity="0.8"/>
  <text x="355" y="122" text-anchor="middle" font-size="8" fill="white" font-family="Malgun Gothic">유닛쿨러</text>

  <!-- Freezer label -->
  <text x="340" y="425" text-anchor="middle" font-size="14" fill="#2980b9" font-weight="bold" font-family="Malgun Gothic">Zone B 냉동고</text>
  <text x="340" y="443" text-anchor="middle" font-size="10" fill="#2980b9" font-family="Malgun Gothic">-18℃ | 462 듀오메이커</text>

  <!-- Freezer door -->
  <rect x="430" y="200" width="20" height="160" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="3" opacity="0.8"/>

  <!-- ===== ZONE C: 가공·포장실 ===== -->
  <!-- Work table (stainless steel) -->
  <polygon points="480,520 700,440 700,420 480,490" fill="url(#stainless)" stroke="#999" stroke-width="1.5"/>
  <!-- Table legs -->
  <line x1="500" y1="520" x2="500" y2="620" stroke="#999" stroke-width="3"/>
  <line x1="680" y1="445" x2="680" y2="560" stroke="#999" stroke-width="3"/>

  <!-- Ice balls on table -->
  <g opacity="0.9">
    <circle cx="520" cy="500" r="10" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="545" cy="495" r="10" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="570" cy="490" r="10" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="595" cy="485" r="10" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="620" cy="478" r="10" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="645" cy="472" r="10" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="670" cy="466" r="10" fill="url(#iceGlow)" stroke="#90caf9"/>
  </g>
  <text x="590" y="460" text-anchor="middle" font-size="9" fill="#2980b9" font-family="Malgun Gothic">투명 아이스볼 Ø65mm</text>

  <!-- Laser engraver -->
  <rect x="500" y="290" width="60" height="70" fill="#2c3e50" stroke="#1a252f" rx="3"/>
  <rect x="505" y="295" width="50" height="40" fill="#333" rx="2"/>
  <text x="530" y="320" text-anchor="middle" font-size="7" fill="#e74c3c" font-family="Malgun Gothic">LASER</text>
  <text x="530" y="370" text-anchor="middle" font-size="9" fill="#e67e22" font-family="Malgun Gothic">레이저 각인기</text>

  <!-- Fridge -->
  <rect x="600" y="200" width="80" height="180" fill="#ddd" stroke="#aaa" stroke-width="1.5" rx="3"/>
  <rect x="605" y="205" width="70" height="85" fill="#e8eaf6" stroke="#bbb" rx="2"/>
  <rect x="605" y="295" width="70" height="80" fill="#e8eaf6" stroke="#bbb" rx="2"/>
  <text x="640" y="250" text-anchor="middle" font-size="8" fill="#555" font-family="Malgun Gothic">보관</text>
  <text x="640" y="340" text-anchor="middle" font-size="8" fill="#555" font-family="Malgun Gothic">냉장고</text>

  <text x="580" y="650" text-anchor="middle" font-size="13" fill="#e67e22" font-weight="bold" font-family="Malgun Gothic">Zone C 가공·포장</text>

  <!-- ===== ZONE D: 서비스·판매 ===== -->
  <!-- Robot barista -->
  <g transform="translate(800,350)">
    <rect x="-30" y="0" width="60" height="90" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="8"/>
    <rect x="-25" y="5" width="50" height="30" fill="#a5d6a7" rx="5"/>
    <circle cx="0" cy="20" r="8" fill="#66bb6a"/>
    <text x="0" y="24" text-anchor="middle" font-size="6" fill="white">AI</text>
    <!-- Robot arm -->
    <line x1="30" y1="40" x2="55" y2="25" stroke="#388e3c" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="25" x2="70" y2="45" stroke="#388e3c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="70" cy="45" r="5" fill="#388e3c"/>
    <text x="0" y="108" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="bold" font-family="Malgun Gothic">로봇 바리스타</text>
  </g>

  <!-- Kiosk -->
  <rect x="900" y="250" width="50" height="130" fill="#2c3e50" stroke="#1a252f" stroke-width="2" rx="3"/>
  <rect x="907" y="260" width="36" height="60" fill="#333" rx="2"/>
  <!-- Screen glow -->
  <rect x="910" y="263" width="30" height="54" fill="#27ae60" opacity="0.3" rx="2"/>
  <text x="925" y="290" text-anchor="middle" font-size="7" fill="#27ae60" font-family="Malgun Gothic">ORDER</text>
  <text x="925" y="400" text-anchor="middle" font-size="9" fill="#27ae60" font-family="Malgun Gothic">무인 키오스크</text>

  <!-- Tumbler display -->
  <g transform="translate(950,500)">
    <rect x="0" y="0" width="100" height="60" fill="#e8eaf6" stroke="#5c6bc0" rx="3" opacity="0.8"/>
    <!-- Tumblers -->
    <rect x="10" y="10" width="12" height="22" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="28" y="10" width="12" height="22" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="46" y="10" width="12" height="22" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="64" y="10" width="12" height="22" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <rect x="82" y="10" width="12" height="22" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <text x="50" y="50" text-anchor="middle" font-size="8" fill="#5c6bc0" font-family="Malgun Gothic">아블러 텀블러</text>
  </g>

  <!-- Ice display showcase -->
  <rect x="720" y="500" width="180" height="50" fill="rgba(200,230,255,0.3)" stroke="#64b5f6" stroke-width="1.5" rx="5"/>
  <g opacity="0.7">
    <circle cx="750" cy="520" r="8" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="775" cy="518" r="8" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="800" cy="516" r="8" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="825" cy="514" r="8" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="850" cy="512" r="8" fill="url(#iceGlow)" stroke="#90caf9"/>
    <circle cx="875" cy="510" r="8" fill="url(#iceGlow)" stroke="#90caf9"/>
  </g>
  <text x="810" y="560" text-anchor="middle" font-size="9" fill="#2980b9" font-family="Malgun Gothic">얼음 디스플레이 쇼케이스</text>

  <text x="870" y="650" text-anchor="middle" font-size="13" fill="#27ae60" font-weight="bold" font-family="Malgun Gothic">Zone D 서비스·판매</text>

  <!-- ===== LED LIGHTING ===== -->
  <rect x="250" y="97" width="700" height="4" fill="#00e5ff" opacity="0.4" rx="1"/>

  <!-- ===== ZONE DIVIDER LINES ===== -->
  <line x1="200" y1="700" x2="350" y2="100" stroke="#e74c3c" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="450" y1="680" x2="500" y2="100" stroke="#2980b9" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="700" y1="650" x2="680" y2="100" stroke="#e67e22" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="720" width="1140" height="60" fill="rgba(0,0,0,0.3)" rx="8"/>
  <g font-size="10" font-family="Malgun Gothic">
    <rect x="50" y="738" width="14" height="14" fill="#e74c3c" rx="2"/>
    <text x="70" y="750" fill="#eee">A 냉동기실</text>
    <rect x="180" y="738" width="14" height="14" fill="#2980b9" rx="2"/>
    <text x="200" y="750" fill="#eee">B 냉동고 (462 듀오메이커)</text>
    <rect x="400" y="738" width="14" height="14" fill="#e67e22" rx="2"/>
    <text x="420" y="750" fill="#eee">C 가공·포장 (각인·QC)</text>
    <rect x="600" y="738" width="14" height="14" fill="#27ae60" rx="2"/>
    <text x="620" y="750" fill="#eee">D 서비스 (로봇·키오스크)</text>
    <circle cx="820" cy="745" r="7" fill="url(#iceGlow)" stroke="#90caf9"/>
    <text x="835" y="750" fill="#eee">투명 아이스볼</text>
    <rect x="940" y="738" width="14" height="14" fill="#f5f5f5" stroke="#bbb" rx="3"/>
    <text x="960" y="750" fill="#eee">아블러 텀블러</text>
  </g>

  <text x="1150" y="790" text-anchor="end" font-size="9" fill="#555">© 2026 MasterMinding Group — MIF-20 Interior v1.0</text>
</svg>
